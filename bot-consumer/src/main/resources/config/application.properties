spring.application.name=bot-consumer
server.port=${SERVER_PORT:8070}

# Telegram
bot.token=${TELEGRAM_BOT_TOKEN:}
bot.username=${BOT_USERNAME:event001_bot}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:kafka2:19092}
spring.kafka.consumer.group-id=event-notification-bot
spring.kafka.consumer.auto-offset-reset=earliest
app.kafka.topic=events

# Subscriptions (username -> chat id) survive restarts
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/NotificationSystem}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
